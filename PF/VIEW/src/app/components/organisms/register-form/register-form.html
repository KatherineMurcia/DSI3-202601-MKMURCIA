<div class="register-card card">
  <div class="register-brand">
    <app-logo />
  </div>
  <h1>Crear cuenta</h1>
  <p class="subtitle">Ingresa tus datos para registrarte</p>

  <form (ngSubmit)="onRegister()" class="register-form">
    <div class="form-group">
      <label>Nombre completo</label>
      <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Juan Pérez" required />
    </div>
    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" [(ngModel)]="correo" name="correo" placeholder="tu@correo.com" required />
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="contrasena" name="contrasena" placeholder="••••••••" required />
    </div>

    @if (error()) { <div class="alert-error">{{ error() }}</div> }
    @if (success()) { <div class="alert-success">{{ success() }}</div> }

    <app-button type="submit" [fullWidth]="true">Registrarse</app-button>
  </form>

  <p class="register-footer">
    ¿Ya tienes cuenta? <a routerLink="/auth/login">Iniciar sesión</a>
  </p>
</div>
