<div class="input-field">
  <label class="input-field__label">{{ label }}</label>
  <div class="input-field__wrapper">
    <input
      class="input-field__input"
      [type]="inputType"
      [placeholder]="placeholder"
      [value]="value"
      (input)="onInput($event)"
    />
    @if (type === 'password') {
      <span class="input-field__toggle" (click)="togglePassword()">
        {{ showPassword ? '🙈' : '👁️' }}
      </span>
    }
  </div>
</div>
