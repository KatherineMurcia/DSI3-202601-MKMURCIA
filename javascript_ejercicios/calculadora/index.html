<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Calculadora de Notas</h1>
    <p>Ingrese las notas obtenidas en cada evaluación:</p>

    <div class="contenedor">

        <div class="fila-notas">
            <div class="nota">
                <label>Nota 1 (5%)</label>
                <input type="number" id="n1" step="0.01" min="0" max="5">
            </div>

            <div class="nota">
                <label>Nota 2 (10%)</label>
                <input type="number" id="n2" step="0.01" min="0" max="5">
            </div>

            <div class="nota">
                <label>Nota 3 (10%)</label>
                <input type="number" id="n3" step="0.01" min="0" max="5">
            </div>

            <div class="nota">
                <label>Nota 4 (10%)</label>
                <input type="number" id="n4" step="0.01" min="0" max="5">
            </div>

            <div class="nota">
                <label>Nota 5 (15%)</label>
                <input type="number" id="n5" step="0.01" min="0" max="5">
            </div>

            <div class="nota">
                <label>Nota 6 (15%)</label>
                <input type="number" id="n6" step="0.01" min="0" max="5">
            </div>

            <div class="nota">
                <label>Nota 7 (15%)</label>
                <input type="number" id="n7" step="0.01" min="0" max="5">
            </div>

            <div class="nota">
                <label>Nota 8 (20%)</label>
                <input type="number" id="n8" step="0.01" min="0" max="5">
            </div>

        </div>

        <button onclick="calcularNota()">Calcular Nota Final</button>

        <h2 id="resultado"></h2>

    </div>

    <script src="calculadora.js"></script>

</body>

</html>
