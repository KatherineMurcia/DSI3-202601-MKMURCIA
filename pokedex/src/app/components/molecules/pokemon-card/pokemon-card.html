<div class="card">
  <app-pokemon-image [src]="pokemon.sprites.front_default.toString()" [alt]="pokemon.name"></app-pokemon-image>
  <p class="number">#{{ pokemon.id | number:'3.0-0' }}</p>
  <h3 class="name">{{ pokemon.name | uppercase }}</h3>
  <div class="types">
    <app-badge *ngFor="let t of pokemon.types" [type]="t.type.name"></app-badge>
  </div>
</div>
