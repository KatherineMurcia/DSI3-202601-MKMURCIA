<div class="detail">
  <h2>POKEMON DETALLE</h2>
  <app-search-bar (search)="search.emit($event)"></app-search-bar>
  <div *ngIf="pokemon">
    <img [src]="pokemon.sprites.front_default" [alt]="pokemon.name">
    <h3>{{ pokemon.name | uppercase }} #{{ pokemon.id | number:'3.0-0' }}</h3>
    <div class="types">
      <span *ngFor="let t of pokemon.types" class="badge">
        {{ t.type.name }}
      </span>
    </div>
    <h4>ESTADISTICAS BASE</h4>
    <div *ngFor="let s of pokemon.stats" class="stat">
      <span class="stat-name">{{ s.stat.name | uppercase }}</span>
      <div class="stat-bar">
        <div class="stat-fill" [style.width.%]="s.base_stat / 255 * 100"></div>
      </div>
      <span class="stat-value">{{ s.base_stat }}</span>
    </div>
  </div>
</div>
