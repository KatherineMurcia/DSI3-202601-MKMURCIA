<div class="credentials-form">
  <app-input-field
    label="Correo electrónico"
    type="email"
    placeholder="usuario@email.com">
  </app-input-field>

  <app-input-field
    label="Contraseña"
    type="password"
    placeholder="••••••••">
  </app-input-field>

  <app-error-message
    *ngIf="showError"
    message="Credenciales incorrectas">
  </app-error-message>
</div>
